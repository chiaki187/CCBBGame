<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ccbbgame</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.min.js"></script>

    <style>
      body {
          font-family: sans-serif;
          padding: 20px;
      }

      img {
          width: 300px;
          margin-top: 20px;
      }

      #palette, #opponent, #selected {
          display: flex;
          gap: 10px;
          margin-top: 20px;
      }

        .color-box-me, .color-box-opponent, .color-box-selected {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
            text-align: center;
            gap: 50px;
        }

      button {
          margin-top: 10px;
          margin-right: 10px;
      }

      /* ルーレット */
      .player-panel{
          display: flex;
          gap: 10px;
          margin-top: 20px;
          padding: 10px;
          border: 4px solid transparent;
          border-radius: 10px;
          transition: border-color 0.15s ease;
      }

      .player-panel.active{
          border-color: #00bfff;
      }


      <!--カメラ画面用-->
      .col {
          display: flex;
          flex-direction: column;
      }
      .row {
          display: flex;
          flex-direction: row;
      }
      #camera {
          width: 100%;
          height:100%;
          transform: scaleX(-1);
      }
      #canvas, #overlay,#matterCanvas {
          /* width: 1280px;
          height: 720px; */
          width: 100%;
          height:100%;
          position: absolute;
          left: 0;
          top: 0;
      }
      #draw {
          position: relative;
      }

      /* 結果画面 */
      #finishgameView {
          position:fixed;
          inset:0;
          z-index:9999;

          justify-content:center;
          align-items:center;

          background:rgba(0,0,0,.4);

          pointer-events:none;
      }

      .result-window {
          width:400px;
          padding:30px;
          border-radius:15px;
          background:white;

          pointer-events:auto;
      }
    </style>

    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <!--タイトル画面-->
    <div id="firstView">
      <div class="center">
        <div class="container">
          <div class="box red">C</div>
          <div class="box yellow">C</div>
          <div class="box green">B</div>
          <div class="box purle">B</div>
        </div>

        <div style="font-size: 80px;">Game</div>
        <div style="font-size: 20px;">カラーカスタム積み木ゲーム</div>


        <button style="position: relative; top: 10vh;" >Start</button>
      </div>
    </div>

    <!--ゲーム開始画面-->
    <div id="startgameView" style="display:none;">
      <div class="center">
        <div class="minicontainer">
          <div class="minibox red"></div>
          <div class="minibox yellow"></div>
          <div class="minibox green"></div>
          <div class="minibox purle"></div>
        </div>
       
         
        <div id="whoSelectedText" class="bigtext">写真から色を検出して</div>
        <div id="countDown" class="bigtext" >積み木の色を
          <span style="color:#FA8B8A;">カ</span>
          <span style="color:#FACA57;">ス</span>
          <span style="color:#68D4CB;">タ</span>
          <span style="color:#AB99E0;">ム</span>
          しよう！</div>
          <img id="img">
        <div class="container">

          <!--色選択の説明-->
          <div id="colorSystemExplainText" class="transparentcard center">
            <h2>好きな写真を選んでね！</h2>       
            <!-- ファイル選択 -->
            <input type="file" id="fileInput" accept="image/*">
            <!-- ランダムカラーボタン -->
            <br>
            <button id="randomBtn">ランダムカラー</button>
            <br>
          </div>

          <div id="palette" class="card center player-panel">
            <h2>あなたのパレット</h2>
            
            <div >
              <div class="center">
                <div class="row">
                  <div class="color-box-me"></div>
                  <div class="color-box-me"></div>
                  <div class="color-box-me"></div>
                  <div class="color-box-me"></div>
                </div>
                <div class="row">
                  <div class="color-box-me"></div>
                  <div class="color-box-me"></div>
                  <div class="color-box-me"></div>
                  <div class="color-box-me"></div>
                </div>
              </div>
            </div>
            
                
          
            <p>決定すると相手にあなたのパレットが送られます</p>
            <br>
            <button id="decideBtn">決定</button>
          </div>

          <div id="opponent" class="card center player-panel">
            <h2>相手のパレット</h2>

            <div >
              <div class="center">
                <div class="row">
                  <div class="color-box-opponent"></div>
                  <div class="color-box-opponent"></div>
                  <div class="color-box-opponent"></div>
                  <div class="color-box-opponent"></div>
                </div>
                <div class="row">
                  <div class="color-box-opponent"></div>
                  <div class="color-box-opponent"></div>
                  <div class="color-box-opponent"></div>
                  <div class="color-box-opponent"></div>
                </div>
                <h2 style="color:#ccc;top: 200px";>相手が色を選んでいます</h2>
              </div>
          </div>
          </div>
        

        </div>
      

    

            
        
        <h2>Selected Color</h2>
        <div id="selected">
          <div class="color-box-selected"></div>
          <div class="color-box-selected"></div>
          <div class="color-box-selected"></div>
          <div class="color-box-selected"></div>
          <div class="color-box-selected"></div>
          <div class="color-box-selected"></div>
          <div class="color-box-selected"></div>
          <div class="color-box-selected"></div>
        </div>

        
        <script type="module" src="/src/main.js"></script>
       
      </div>
    </div>


    <!--カメラ画面-->
    <div id="cameraView" style="display:none;">
      <div class="col">
        <div id="cam" class="row">
          <div class="col">
          
            <div>video</div>
          </div>
        </div>
        <div id="draw">
          <canvas id="canvas" width="1280" height="720">
          </canvas>
          <video id="camera" width="1280" height="720">
          </video>
          <canvas id="overlay" width="1280" height="720">
          </canvas>
          <canvas id="matterCanvas" width="1280" height="720"></canvas>
        </div>
      </div>
    </div>

    <!-- ゲーム終了画面 -->
    <div id="finishgameView" style="display:none;">
      <div class="result-window">
        <h1>ゲーム終了</h1>

        <h2 id="resultText"></h2>

        <button id="closeResult">閉じる</button>
      </div>
    </div>
    
  </body>

  <script type="module" src="./src/main.js"></script>

    
  </body>

</html>
