<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ccbbgame</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.min.js"></script>

    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        img {
            width: 300px;
            margin-top: 20px;
        }

        #palette, #opponent, #selected {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .color-box-me, .color-box-opponent, .color-box-selected {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
            text-align: center;
            gap: 50px;
        }

        button {
            margin-top: 10px;
            margin-right: 10px;
        }


    <!--カメラ画面用-->
    .col {
        display: flex;
        flex-direction: column;
    }
    .row {
        display: flex;
        flex-direction: row;
    }
    #camera {
        width: 100%;
        height:100%;
        transform: scaleX(-1);
    }
    #canvas, #overlay,#matterCanvas {
        width: 1280px;
        height: 720px;
        position: absolute;
        left: 0;
        top: 0;
    }
    #draw {
        position: relative;
    }
    </style>

    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <!--タイトル画面-->
    <div id="firstView">
      <div class="center">
        <div class="container">
          <div class="box red">C</div>
          <div class="box yellow">C</div>
          <div class="box green">B</div>
          <div class="box purle">B</div>
        </div>

        <div style="font-size: 80px;">Game</div>
        <div style="font-size: 20px;">カラーカスタム積み木ゲーム</div>


        <button style="position: relative; top: 10vh;" >Start</button>
      </div>
    </div>

    <!--ゲーム開始画面-->
    <div id="startgameView" style="display:none;">
      <div class="center">
        <div class="minicontainer">
          <div class="minibox red"></div>
          <div class="minibox yellow"></div>
          <div class="minibox green"></div>
          <div class="minibox purle"></div>
        </div>
       
         
        <div class="bigtext">写真から色を検出して</div>
        <div class="bigtext" >積み木の色を
          <span style="color:#FA8B8A;">カ</span>
          <span style="color:#FACA57;">ス</span>
          <span style="color:#68D4CB;">タ</span>
          <span style="color:#AB99E0;">ム</span>
          しよう！</div>

        <div class="container">
          <div class="transparentcard center">
            <h2>好きな写真を選んでね！</h2>       
            <!-- ファイル選択 -->
            <input type="file" id="fileInput" accept="image/*">
            <img id="img">
          </div>

          <div class="card center">
            <h2>あなたのパレット</h2>
            
            <div id="palette">
              <div class="center">
                <div class="row">
                  <div class="color-box-me"></div>
                  <div class="color-box-me"></div>
                  <div class="color-box-me"></div>
                  <div class="color-box-me"></div>
                </div>
                <div class="row">
                  <div class="color-box-me"></div>
                  <div class="color-box-me"></div>
                  <div class="color-box-me"></div>
                  <div class="color-box-me"></div>
                </div>
              </div>
            </div>
            
                
          
            <p>決定すると相手にあなたのパレットが送られます</p>
            <br>
            <button id="decideBtn">決定</button>
          </div>

          <div class="card center">
            <h2>相手のパレット</h2>

            <div id="opponent">
              <div class="center">
                <div class="row">
                  <div class="color-box-opponent"></div>
                  <div class="color-box-opponent"></div>
                  <div class="color-box-opponent"></div>
                  <div class="color-box-opponent"></div>
                </div>
                <div class="row">
                  <div class="color-box-opponent"></div>
                  <div class="color-box-opponent"></div>
                  <div class="color-box-opponent"></div>
                  <div class="color-box-opponent"></div>
                </div>
                <h2 style="color:#ccc;top: 200px";>相手が色を選んでいます</h2>
              </div>
          </div>
          </div>
        

        </div>
      

        <!-- ランダムカラーボタン -->
            <br>
            <button id="randomBtn">ランダムカラー</button>
            <br>

         
      
         

       
        
        <h2>Selected Color</h2>
        <div id="selected">
          <div class="color-box-selected"></div>
          <div class="color-box-selected"></div>
          <div class="color-box-selected"></div>
          <div class="color-box-selected"></div>
          <div class="color-box-selected"></div>
          <div class="color-box-selected"></div>
          <div class="color-box-selected"></div>
          <div class="color-box-selected"></div>
        </div>

        <div id="countDown"></div>
        <script type="module" src="/src/main.js"></script>
       
      </div>
    </div>


    <!--カメラ画面-->
    <div id="cameraView" style="display:none;">
      <div class="col">
        <div id="cam" class="row">
          <div class="col">
          
            <div>video</div>
          </div>
        </div>
        <div id="draw">
          <canvas id="canvas" width="1280" height="720">
          </canvas>
          <video id="camera" width="1280" height="720">
            </video>
          <canvas id="overlay" width="1280" height="720">
          </canvas>
          <canvas id="matterCanvas" width="1280" height="720"></canvas>
        </div>
      </div>
    </div>
    
  </body>

  <script type="module" src="./src/js/color.js"></script>
  <script type="module" src="./src/main.js"></script>

    
  </body>

</html>
