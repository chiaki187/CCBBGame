<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ccbbgame</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.min.js"></script>

    <style>
      body {
          font-family: sans-serif;
          /* padding: 20px; */
      }

      .viewCenter {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
      }

      #firstView,
      #waitingContent,
      #finishgameView{
          display:flex;
          justify-content:center;
          align-items:center;
          width:100vw;
          height:100vh;
      }

      #startgameView,
      #cameraView{
          display:flex;
          justify-content:center;
          align-items:center;
          width:100vw;
          height:100vh;

          flex-shrink: 0;
          overflow: hidden;
          background-repeat: no-repeat;
          background-position: center;
          background-size: cover;
      }

      #firstViewContent,
      #waitingContent,
      #startgameContent,
      #cameraContent,
      #finishgameContent{
          /* width:100%;
          height:100%;
          transform-origin:center center; */
          width:100%;
          height:100%;

          display:flex;
          justify-content:center;
          align-items:center;

          transform-origin:center center;
      }

      img {
          width: 200px;
          height: 150px;
          margin-left: 50px;
          margin-top: 20px;
          align-items: center;
      }

      #palette, #opponent, #selected {
          display: flex;
          gap: 10px;
          margin-top: 20px;
      }

      .color-box-me, .color-box-opponent, .color-box-selected {
          width: 80px;
          height: 80px;
          border-radius: 8px;
          border: 1px solid #ccc;
          background: #eee;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 10px;
          color: white;
          text-align: center;
          gap: 50px;
      }

      button {
          margin-top: 10px;
          margin-right: 10px;
      }

      /* ルーレット */
      .player-panel{
          display: flex;
          gap: 10px;
          margin-top: 20px;
          padding: 10px;
          border: 4px solid transparent;
          border-radius: 10px;
          transition: border-color 0.15s ease;

          background-size: cover;
          background-position: center;
          background-repeat: no-repeat;

      }

      .player-panel.active{
          border-color: #ffffff;

          box-shadow:
              0 0 16px rgba(255, 242, 0, 0.5),
              0 0 40px rgba(255, 251, 0, 0.3),
              0 0 70px rgba(225, 255, 0, 0.15);
      }


      /*カメラ画面用*/
      .col {
          display: flex;
          flex-direction: column;
      }
      .row {
          display: flex;
          flex-direction: row;
      }
      .draw{
          flex:1;
          position:relative;
          aspect-ratio:16/9;
          min-width:700px;
      }

      #camera {
        transform: scaleX(-1);
      }
     
      #canvas, #overlay,#matterCanvas {
         
          /*aspect-ratio: 16 / 9;*/
          width: 100%;
          height:100%;
          position: absolute;
          left: 0;
          top: 0;
      }

      .result-window {
          width:400px;
          padding:30px;
          border-radius:15px;
          background:white;

          pointer-events:auto;
      }

      .shine{
          padding:10px;
          color:rgb(0, 0, 0);
          border-radius:15px;
      }
    </style>

    <link rel="stylesheet" href="style.css">
  </head>
  <body>
  

    <!--タイトル画面-->
    <div id="firstView">
      <div class="viewCenter">
        <div class="center">
          <div class="container">
            <div class="box red">C</div>
            <div class="box yellow">C</div>
            <div class="box green">B</div>
            <div class="box purle">B</div>
          </div>

          <div style="font-size: 80px;">Game</div>
          <div style="font-size: 20px;">カラーカスタム積み木ゲーム</div>

          <button id="startBtn" style="position: relative; top: 10vh;" >Start</button>
        </div>
      </div>
    </div>

    <!-- 待機画面 -->
    <div id="waitingView" class="viewCenter" style="display: none;">
      <div id="waitingContent">
        <div class="center">
          <div class="bigtext">相手を探しています</div>
          <div class="minicontainer waitingAnimation">
            <div class="minibox red"></div>
            <div class="minibox yellow"></div>
            <div class="minibox green"></div>
            <div class="minibox purle"></div>
          </div>
        </div>
      </div>
    </div>

    <!--ゲーム開始画面-->
    <div id="startgameView" style="display:none;">
      <div id="roulette-grass">
        <div id="startgameContent">
          <div class="center">
            <div class="minicontainer">
              <div class="minibox red"></div>
              <div class="minibox yellow"></div>
              <div class="minibox green"></div>
              <div class="minibox purle"></div>
          </div>
        
          <!--img id="selectedImage"-->
          <div id="whoSelectedText" class="bigtext">写真から色を検出して</div>
          <div id="countDown" class="bigtext" >積み木の色を
            <span style="color:#FA8B8A;">カ</span>
            <span style="color:#FACA57;">ス</span>
            <span style="color:#68D4CB;">タ</span>
            <span style="color:#AB99E0;">ム</span>
            しよう！</div>
          <div class="container">

            <!--色選択の説明-->
            <div id="colorSystemExplainText" class="transparentcard">
              <h2 style=" margin-top: 40px; text-align: center;">選択方法</h2>       
              <h3 style=" margin-top: 40px;">❶好きな写真を選択</h3>
              <!-- ファイル選択 -->
              <input type="file" id="fileInput" accept="image/*">
              <h2 style=" margin-top: 0px;margin-bottom: 0px; text-align: center;"></h2>  
              <img id="img" src="src/images/4.png" alt="サンプル画像">     
              <h3>❷写真から８色を抽出</h3>
              <h2 style=" margin-top: 0px;margin-bottom: 0px; text-align: center;"></h2> 
              <h3>❸あなた または 相手 のパレットから<br>
                  　ランダムに選択！</h3>
              <!-- ランダムカラーボタン -->
              <button id="randomBtn" style="font-size:small; display:none">Random</button>
            </div>

              <div id="palette" class="card center player-panel">
                <h2 id="backColor-me" class="shine">あなたのパレット</h2>
                
                <div>
                  <div id="myPalette" class="center">
                    <div class="row">
                      <div class="color-box-me"></div>
                      <div class="color-box-me"></div>
                      <div class="color-box-me"></div>
                      <div class="color-box-me"></div>
                    </div>
                    <div class="row">
                      <div class="color-box-me"></div>
                      <div class="color-box-me"></div>
                      <div class="color-box-me"></div>
                      <div class="color-box-me"></div>
                    </div>
                  </div>
                </div>
                
                    
              
                <p class="nextDelete">決定すると相手にあなたのパレットが送られます</p>
                <br>
                <button id="decideBtn" class="nextDelete">決定</button>
              </div>

              <div id="opponent" class="card center player-panel">
                <h2 id="backColor-opponent" class="shine">相手のパレット</h2>

                <div >
                  <div class="center">
                    <div class="row">
                      <div class="color-box-opponent"></div>
                      <div class="color-box-opponent"></div>
                      <div class="color-box-opponent"></div>
                      <div class="color-box-opponent"></div>
                    </div>
                    <div class="row">
                      <div class="color-box-opponent"></div>
                      <div class="color-box-opponent"></div>
                      <div class="color-box-opponent"></div>
                      <div class="color-box-opponent"></div>
                    </div>
                    <h2 class="nextDelete" style="color:#ccc;margin-top: 120px;">相手が色を選んでいます</h2>
                  </div>
              </div>
              </div>
            

            </div>  
            <script type="module" src="/src/main.js"></script>
          
          </div>
        </div>
      </div>
    </div>


    <!--カメラ画面-->
    <div id="cameraView" style="display:none;">
      <div id="cameraContent">
        <div class="center">
          <div class="minicontainer">
            <div class="minibox red"></div>
            <div class="minibox yellow"></div>
            <div class="minibox green"></div>
            <div class="minibox purle"></div>
          </div>

          <div class="container">
            
              <div class="cameraCardLeft">
                <!-- <div class="container">
                  <div class="box red">C</div>
                  <div class="box yellow">C</div>
                  <div class="box green">B</div>
                  <div class="box purle">B</div>
                </div> -->
                <!-- <div class="cameraMiniCard" style="margin-bottom: 50px;"> -->
                <div class="cameraMiniTop">
                  <div class="cameraMiniCard glass-card">
                    <div id="playerCard"></div>
                  </div>
                  <div class="cameraMiniCard glass-card" style="width: 100%;">
                    <!-- <img id="img"> -->
                    <!-- <div id="playerCard"></div> -->
                    <div id="turnArea">
                      <div id="turnPlayer"></div>
                      <div id="turnPlayerText">のターンです</div>
                    </div>
                  </div>
                </div>
                
                
                <div class="cameraMiniCard glass-card">
                  <div class="center">
                    <h2 class="marker-highlight">ブロック落下まで</h2>
                    <div id="dropCountDown"></div>
                    <h2 class="dummyText">右手の人差し指でブロックを落とす位置を決めよう</h2>
                  </div>
                </div>
              </div>
            
            <div class="cameraCardRight">
              <div id="dropText">
                <span style="color:#FA8B8A;">D</span>
                <span style="color:#FACA57;">R</span>
                <span style="color:#68D4CB;">O</span>
                <span style="color:#AB99E0;">P</span>
              </div>
              <div class="col draw " style="top: 0;">  
                <canvas id="canvas"></canvas>
                <video id="camera" style="top: 0; border-radius: 12px; border: 4px solid #FFFFFF;"></video>
                <canvas id="overlay"></canvas>
                <canvas id="matterCanvas"></canvas>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>



    <!-- ゲーム終了画面 -->
    <div id="finishgameView" style="display:none;">
      <div id="finishgameContent">
        <div class="center">
          <div class="container">

            <div class="towCardTrans">
              <div class="center">
                <div style="font-size: 40px; font-weight: bold;">ゲーム終了</div>
                <div id="reusltText" style="font-size: 40px; margin-bottom:50px; font-weight: bold;"></div>
                <div class="container">
                  <img src="src/images/3.png" style="width:250px;" alt="サンプル画像">
                  <div>
                    <h2>最高の高さ</h2>
                    <h2 id="towerHeightText" style="margin-left:50px;">m</h2>
                  </div>
                </div>
                <div id="resultComment">とても素晴らしい戦いでした</div>
                <button id="closeResult" style="position: relative; top: 2vh;" >Title</button>
              </div>
            </div>
            <div id="towCard" class="towCard">
            </div>
          </div>
        </div>
      </div>
    </div>
    
  </body>


</html>
